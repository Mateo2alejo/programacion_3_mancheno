<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Vuelos - Cálculos Operativos</title>
    <script src="dom10-suma.mp.js" defer></script>
</head>
<body>
    <h1 id="titulo">Gestión de Vuelos - Cálculos de Operación</h1>
    
    <h2>Cálculo de Pasajeros Totales</h2>
    <input id="campo_numero1"
        type="number"
        placeholder="Pasajeros Vuelo A">
    <input id="campo_numero2"
        type="number"
        placeholder="Pasajeros Vuelo B">
    <button id="btn_sumar" class="boton">
        Calcular Total</button>
    <p id="resultado"></p>

    <h2>Cálculo de Área de Pista / Almacén</h2>
    <input id="campo_numero3"
        type="number"
        placeholder="Largo (m)">
    <input id="campo_numero4"
        type="number"
        placeholder="Ancho (m)">
    <button id="btn_area" class="boton1">
        Calcular Área</button>
    <p id="resultado1"></p>
</body>
</html>
