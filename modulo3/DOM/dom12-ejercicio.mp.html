<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Vuelos MM - SkyPort</title>
    <script src="dom12-ejercicio.mp.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #1a5276;
            color: white;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: inline-block;
            width: 120px;
        }

        .stat-card {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 5px;
            width: 200px;
            margin-top: 20px;
            background-color: #f9f9f9;
        }

        button {
            background-color: #1a5276;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #154360;
        }
    </style>
</head>

<body>

    <h2>Registro de Vuelos MM</h2>

    <div id="formulario">
        <div class="form-group">
            <label for="aerolinea">Aerolínea:</label>
            <input type="text" id="aerolinea" placeholder="Ej. SkyPort / MM">
        </div>
        <div class="form-group">
            <label for="destino">Destino:</label>
            <input type="text" id="destino" placeholder="Ej. Quito / Guayaquil">
        </div>
        <div class="form-group">
            <label for="tarifa">Tarifa ($):</label>
            <input type="number" id="tarifa" step="0.01" placeholder="Ej. 150.00">
        </div>
        <button onclick="agregarVuelo()">Agregar Vuelo</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Aerolínea</th>
                <th>Destino</th>
                <th>Tarifa</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
        </tbody>
    </table>

    <div id="stats">
        <div class="stat-card">
            <h3>Tarifa Promedio</h3>
            <p id="stat_promedio">$0.00</p>
        </div>
    </div>

</body>

</html>
