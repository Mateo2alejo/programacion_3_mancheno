<!DOCTYPE html>
<html lang="es">

<body>
    <!-- El JS vive dentro del atributo onclick -->
    <button onclick="alert('Hola, mundo!')">Haz clic</button>
    <h1 id="titulo">Hola</h1>
    <h1 id="titulo2">Cargand...</h1>
    
    <!--Mejor colocar el script al final para no bloquear el renseizado-->
    <script>
        const titulo = document.getElementById("titulo");
        titulo.textContent = "¡Hola, JavaScript!";
        console.log("hello desde la consola");
    </script>

    <script src="01_hello_world.js" defer></script>
</body>

</html>
